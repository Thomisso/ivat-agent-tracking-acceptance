name: Agent tracking

on:
  workflow_dispatch:
    inputs:
      event:
        description: Bounded tracker event envelope from the shared command
        required: true
        type: string

permissions:
  contents: read

# Every registry/Project writer, including future observers, uses this group.
# Wakeups may be reordered; the worker always reads the current registry.
concurrency:
  group: agent-tracking-${{ github.repository }}
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply intent and publish the latest confirmed state
        env:
          GH_TOKEN: ${{ secrets.AGENT_TRACKER_TOKEN }}
          TRACKER_EVENT: ${{ inputs.event }}
        run: node scripts/agent-tracker.mjs worker
